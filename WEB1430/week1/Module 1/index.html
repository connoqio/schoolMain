<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>-Weber State Graduation Countdown-</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>-Weber State Graduation Countdown-</h1>
        </header>
    <div class="enrollment">
        <p style="padding: 20px; font-size: 24px; text-align: center;">These are some of the classes I'm taking!</p>
        <div class="enrollment-list">
        <ul>
            <li class="enrollment-list">CS 1410</li>
            <li class="enrollment-list">WEB 1430</li>
            <li class="enrollment-list">CYBER 2300</li>
            <li class="enrollment-list">GEO 1030</li>
            <li class="enrollment-list">PS 3250</li>
        </ul>
        </div>
    </div>
        <main>
            <img src="weber-state-logo.jpg" alt="Weber State Logo" class="logo-bottom-right">
            <section id="countdown">
                <div class="time-container">
                    <span id="countdown-days" class="time">00</span>
                    <span class="label">Days</span>
                </div>
                <div class="time-container">
                    <span id="countdown-hours" class="time">00</span>
                    <span class="label">Hours</span>
                </div>
                <div class="time-container">
                    <span id="countdown-minutes" class="time">00</span>
                    <span class="label">Minutes</span>
                </div>
                <div class="time-container">
                    <span id="countdown-seconds" class="time">00</span>
                    <span class="label">Seconds</span>
                </div>
            </section>
        </main>
        <footer>
            <p style="padding: 20px; font-size: 24px;">^^This is a count down for graduation!^^</p>
            <br>
            <a href="https://www.weber.edu" target="_blank" style="text-decoration: none; color: white; font-size: 24px;">Click here for more information about graduation!</a>
        </footer>
    </div>
</body>
</html>
